<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Касса Параплан</title>
<!--
  Касса Параплан v2 — написана под старые браузеры касс Эвотор (Android 5–7):
  только ES5 (var, function, XMLHttpRequest), без CSS-переменных, без grid и flex-gap.
  Не добавляйте сюда let/const, стрелочные функции, async/await, fetch, `шаблонные строки` —
  на старых терминалах от этого белый экран.
-->
<script>
window.onerror=function(m,src,l){var d=document.getElementById('fatal');if(!d){d=document.createElement('div');d.id='fatal';
d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b4232c;color:#fff;padding:10px;border-radius:8px;font:13px sans-serif';
(document.body||document.documentElement).appendChild(d)}d.innerHTML='Ошибка кассы: '+m+' (строка '+l+')';};
</script>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#eef1f2;color:#14222a;font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.35}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}

/* каркас */
.app{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%;padding:10px 12px}
.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:8px}
.brand{font-weight:700;font-size:18px;margin-right:auto;padding:4px 0}
.brand small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#5b6c73;font-weight:600}
.pill{border:1px solid #d3dbde;background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;margin:3px 0 3px 6px}
.pill.point{background:#0d7268;border-color:#0d7268;color:#fff}
.pill.demo{background:#fbecc9;border-color:#fbecc9;color:#9a6200}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b6c73;margin-right:6px;vertical-align:middle}
.dot.ok{background:#1f7a3f}.dot.warn{background:#c98a00}.dot.bad{background:#b4232c}

.main{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}
.shop{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;min-height:0}
.cart{width:360px;-webkit-flex:none;flex:none;margin-left:10px;background:#fff;border:1px solid #d3dbde;border-radius:12px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0}

/* витрина */
.search{width:100%;border:1px solid #d3dbde;background:#fff;border-radius:10px;padding:11px 12px;font-size:16px;margin-bottom:8px}
.cats{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;padding-bottom:2px}
.cat{display:inline-block;border:1px solid #d3dbde;background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;color:#5b6c73;margin-right:6px}
.cat.on{background:#14222a;border-color:#14222a;color:#fff}
.grid{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;margin:0 -4px;padding-bottom:80px}
.tile{position:relative;float:left;width:-webkit-calc(25% - 8px);width:calc(25% - 8px);margin:4px;min-height:88px;padding:10px;border-radius:10px;border:1px solid #d3dbde;background:#fff;text-align:left;vertical-align:top}
.tile:active{background:#d6ede9}
.tile .nm{display:block;font-size:14px;line-height:1.25;min-height:36px;word-wrap:break-word}
.tile .pr{display:inline-block;font-weight:700;margin-top:6px}
.tile .st{float:right;font-size:12px;color:#5b6c73;margin-top:8px}
.tile .st.zero{color:#b4232c;font-weight:700}
.tile.noprice .pr{color:#b4232c}
.tile .incart{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;line-height:24px;border-radius:12px;background:#e0712c;color:#fff;font-size:13px;font-weight:700;text-align:center;padding:0 6px}
.clear{clear:both}
.empty,.more{clear:both;text-align:center;color:#5b6c73;padding:24px 10px}

/* чек */
.cart-head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:12px 14px;border-bottom:1px solid #d3dbde}
.cart-head b{-webkit-flex:1;flex:1;font-size:16px}
.lines{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.line{padding:9px 14px;border-bottom:1px solid #d3dbde}
.lrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.lrow+.lrow{margin-top:6px}
.line .nm{-webkit-flex:1;flex:1;font-size:14px;word-wrap:break-word;min-width:0;padding-right:8px}
.line .sum{font-weight:700;text-align:right;white-space:nowrap}
.line .sum s{display:block;font-weight:400;font-size:12px;color:#5b6c73}
.qb{width:36px;height:36px;border-radius:8px;border:1px solid #d3dbde;background:#e3e8ea;font-size:18px;font-weight:700;padding:0}
.qv{min-width:30px;text-align:center;font-weight:700}
.db{height:36px;border:1px solid #d3dbde;background:#fff;border-radius:8px;padding:0 10px;font-size:13px;font-weight:700;color:#c2571a;margin-left:6px}
.db.on{background:#fbe4d6;border-color:#e0712c}
.pricef{margin-left:auto;font-size:13px;color:#5b6c73;white-space:nowrap}
.numin{width:76px;text-align:right;border:1px solid #d3dbde;background:#f4f6f7;border-radius:6px;padding:6px;font-size:15px}
.unit{min-width:40px;height:34px;border:1px solid #d3dbde;background:#e3e8ea;border-radius:6px;font-weight:700;margin-left:4px;padding:0 6px}
.lab{font-size:13px;color:#5b6c73;margin-right:6px}
.minus{margin-left:auto;color:#c2571a;font-weight:700}
.cart-empty{padding:36px 14px;text-align:center;color:#5b6c73}
.foot{padding:10px 14px 14px;border-top:1px solid #d3dbde}
.cdisc{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.cdisc .lab{-webkit-flex:1;flex:1;min-width:70px}
.chip{border:1px solid #d3dbde;background:#e3e8ea;border-radius:8px;padding:7px 8px;font-weight:700;font-size:13px;margin:3px 4px 3px 0}
.chip.on{background:#fbe4d6;border-color:#e0712c;color:#c2571a}
.sub{display:-webkit-flex;display:flex;font-size:14px;color:#5b6c73;margin-top:6px}
.sub span{-webkit-flex:1;flex:1}
.sub.d b{color:#c2571a}
.total{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;margin:8px 0 10px}
.total span{-webkit-flex:1;flex:1;color:#5b6c73;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.total b{font-size:28px}
.btn{border:1px solid #d3dbde;background:#fff;border-radius:10px;padding:12px 14px;font-weight:700}
.btn.primary{display:block;width:100%;background:#0d7268;border-color:#0d7268;color:#fff;font-size:18px;padding:15px}
.btn.primary[disabled]{opacity:.45}
.btn.small{padding:7px 10px;font-size:13px}
.btn.danger{color:#b4232c}

/* узкий экран (Эвотор 5 и телефоны): чек — отдельный экран */
.bar{display:none}
@media (max-width:820px){
  .tile{width:-webkit-calc(50% - 8px);width:calc(50% - 8px)}
  .cart{display:none;position:fixed;left:0;right:0;top:0;bottom:0;width:auto;margin:0;border-radius:0;z-index:20;border:none}
  .cart.open{display:-webkit-flex;display:flex}
  .bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 12px;background:#fff;border-top:1px solid #d3dbde}
  .bar .info{-webkit-flex:1;flex:1;text-align:left;background:none;border:none;padding:0}
  .bar .info small{display:block;color:#5b6c73;font-size:12px}
  .bar .info b{font-size:20px}
  .bar .btn{padding:12px 18px}
}
@media (min-width:1200px){.tile{width:-webkit-calc(20% - 8px);width:calc(20% - 8px)}}

/* окна */
.scrim{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(10,20,24,.5);z-index:30;overflow-y:auto;padding:16px 12px}
.sheet{background:#fff;border-radius:14px;max-width:520px;margin:0 auto}
.sh-head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:14px 16px;border-bottom:1px solid #d3dbde}
.sh-head b{-webkit-flex:1;flex:1;font-size:16px}
.x{border:none;background:#e3e8ea;border-radius:8px;width:36px;height:36px;font-size:18px}
.sh-body{padding:14px 16px}
.sh-body>*+*{margin-top:12px}
.big{font-size:34px;font-weight:700;text-align:center}
.methods{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -3px}
.method{-webkit-flex:1;flex:1;min-width:110px;margin:3px;border:1px solid #d3dbde;background:#fff;border-radius:10px;padding:12px 4px;font-weight:700;font-size:14px}
.method.on{background:#d6ede9;border-color:#0d7268;color:#0d7268}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#5b6c73;margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid #d3dbde;background:#f4f6f7;border-radius:10px;padding:11px 12px;font-size:17px}
.quick button{border:1px solid #d3dbde;background:#e3e8ea;border-radius:8px;padding:7px 11px;font-weight:700;margin:6px 6px 0 0}
.change{display:-webkit-flex;display:flex;padding:11px 13px;border-radius:10px;background:#fbe4d6;margin-top:8px}
.change span{-webkit-flex:1;flex:1}
.change b{font-size:20px}
.mix{display:-webkit-flex;display:flex;margin:0 -4px}
.mix .field{-webkit-flex:1;flex:1;margin:0 4px}
.note{font-size:13px;color:#5b6c73;margin:0}
.note.bad{color:#b4232c}
.dg{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;border:1px solid #d3dbde;border-radius:10px;overflow:hidden}
.dg div{width:50%;padding:9px 12px;border-bottom:1px solid #d3dbde}
.dg div.w{width:100%}
.dg span{display:block;font-size:11px;color:#5b6c73;text-transform:uppercase;letter-spacing:.5px}
.dg b{font-size:18px}
.dg .w b{font-size:24px;color:#0d7268}
.subhead{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#5b6c73;margin:16px 0 0}
table.sold{width:100%;border-collapse:collapse;font-size:14px}
table.sold td{padding:6px 0;border-bottom:1px solid #d3dbde;vertical-align:top}
table.sold td.n{text-align:right;white-space:nowrap;padding-left:10px}
.chk{padding:9px 0;border-bottom:1px solid #d3dbde;font-size:14px}
.chk .t{color:#5b6c73}
.chk .s{float:right;font-weight:700}
.chk .d{font-size:13px;color:#5b6c73;margin-top:3px}
.chk.cancelled{opacity:.5}.chk.cancelled .s{text-decoration:line-through}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;margin-left:6px}
.tag.ok{background:#dcf1e2;color:#1f7a3f}.tag.warn{background:#fbecc9;color:#9a6200}.tag.bad{background:#f8dcdd;color:#b4232c}
.toast{position:fixed;left:12px;right:12px;top:12px;text-align:center;z-index:50}
.toast span{display:inline-block;background:#14222a;color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}
.ver{font-size:11px;color:#9aa6ab;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><small>Параплан</small>Касса</div>
    <button class="pill point" id="pointBtn">Точка</button>
    <button class="pill" id="dayBtn"><span class="dot" id="syncDot"></span><span id="dayLabel">Итог дня</span></button>
    <button class="pill" id="setBtn">Настройки</button>
  </div>
  <div class="main">
    <div class="shop">
      <input class="search" id="q" type="search" placeholder="Поиск товара: husky, x-link, 20000…" autocomplete="off">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="cart" id="cart">
      <div class="cart-head"><b>Чек</b><button class="btn small hide" id="backBtn">← Товары</button> <button class="btn small danger" id="clearCart">Очистить</button></div>
      <div class="lines" id="lines"></div>
      <div class="foot">
        <div class="cdisc" id="cdisc">
          <span class="lab">Скидка на чек</span>
          <button class="chip" data-p="5">5%</button><button class="chip" data-p="10">10%</button><button class="chip" data-p="15">15%</button>
          <span style="white-space:nowrap"><input class="numin" id="cdv" type="number" min="0" placeholder="0" style="width:58px"><button class="unit" id="cdu">%</button></span>
        </div>
        <div class="sub hide" id="subGross"><span>Без скидки</span><b id="gross">0 ₽</b></div>
        <div class="sub d hide" id="subDisc"><span>Скидка</span><b id="discV">0 ₽</b></div>
        <div class="total"><span>Итого</span><b id="total">0 ₽</b></div>
        <button class="btn primary" id="payBtn" disabled>Оплатить</button>
      </div>
    </div>
  </div>
</div>

<div class="bar" id="bar">
  <button class="info" id="barInfo"><small id="barCount">Чек пуст</small><b id="barTotal">0 ₽</b></button>
  <button class="btn primary" id="barPay" style="width:auto" disabled>Оплатить</button>
</div>

<!-- оплата -->
<div class="scrim hide" id="payScrim"><div class="sheet">
  <div class="sh-head"><b>Оплата</b><button class="x" data-close="payScrim">×</button></div>
  <div class="sh-body">
    <div class="big" id="payTotal">0 ₽</div>
    <div class="methods" id="methods">
      <button class="method" data-m="cash">Наличные</button><button class="method" data-m="card">Безнал</button>
      <button class="method" data-m="transfer">Перевод</button><button class="method" data-m="mixed">Смешанная</button>
    </div>
    <div id="payCash" class="field">
      <label for="given">Получено от покупателя</label>
      <input id="given" type="number" min="0" placeholder="Без сдачи">
      <div class="quick" id="quick"></div>
      <div class="change"><span>Сдача</span><b id="changeV">0 ₽</b></div>
    </div>
    <div id="payTransfer" class="field hide">
      <label for="toWho">Кому перевели</label>
      <input id="toWho" list="whoList" placeholder="Имя получателя" autocomplete="off">
    </div>
    <div id="payMixed" class="hide">
      <div class="mix">
        <div class="field"><label for="mCash">Нал</label><input id="mCash" type="number" min="0"></div>
        <div class="field"><label for="mCard">Безнал</label><input id="mCard" type="number" min="0"></div>
        <div class="field"><label for="mTr">Перевод</label><input id="mTr" type="number" min="0"></div>
      </div>
      <div class="field" style="margin-top:8px"><label for="mWho">Кому перевели</label><input id="mWho" list="whoList" placeholder="Если был перевод" autocomplete="off"></div>
      <p class="note" id="mixNote" style="margin-top:6px"></p>
    </div>
    <button class="btn primary" id="confirmPay">Провести чек</button>
  </div>
</div></div>

<!-- итог дня -->
<div class="scrim hide" id="dayScrim"><div class="sheet">
  <div class="sh-head"><b id="dayTitle">Итог дня</b><button class="x" data-close="dayScrim">×</button></div>
  <div class="sh-body">
    <div class="dg" id="daySum"></div>
    <p class="note" id="syncNote"></p>
    <p class="subhead">Продано за день</p>
    <div id="soldList"></div>
    <p class="subhead">Чеки</p>
    <div id="dayList"></div>
  </div>
</div></div>

<!-- настройки -->
<div class="scrim hide" id="setScrim"><div class="sheet">
  <div class="sh-head"><b>Настройки</b><button class="x" data-close="setScrim">×</button></div>
  <div class="sh-body">
    <div class="field"><label for="pointSel">Точка этой кассы</label><select id="pointSel"></select></div>
    <div class="field"><label for="urlIn">Ссылка скрипта таблицы</label><input id="urlIn" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="font-size:14px"></div>
    <p class="note" id="setNote">Товары, цены и остатки берутся из Эвотора — из магазина выбранной точки.</p>
    <div><button class="btn primary" id="saveSet">Сохранить</button></div>
    <div><button class="btn" id="reloadCat" style="width:100%">Обновить товары</button></div>
    <p class="ver" id="ver"></p>
  </div>
</div></div>

<datalist id="whoList"></datalist>
<div class="toast hide" id="toast"><span id="toastT"></span></div>

<script>
var VERSION='2.0 · совместимая';
var DEFAULT_URL='https://script.google.com/macros/s/AKfycbyxBZRqCt3OLKHLFildDJhvEhL5GnlkwYkCP6fVwF_uuYdtjw-FW_sjfkqNbU3ah3E/exec';
var POINTS_DEFAULT=['Москва','Планировочная','Никитина','Шлюз','Зорге'];

/* ---------- мелочи ---------- */
function $(id){return document.getElementById(id)}
function show(el,on){if(typeof el==='string')el=$(el);var c=' '+el.className+' ';
  if(on){el.className=c.replace(' hide ',' ').replace(/^\s+|\s+$/g,'')}else if(c.indexOf(' hide ')<0){el.className=(el.className+' hide').replace(/^\s+/,'')}}
function hasCls(el,c){return el&&el.className!=null&&(' '+el.className+' ').indexOf(' '+c+' ')>-1}
function up(el,test){while(el&&el!==document){if(test(el))return el;el=el.parentNode}return null}
function attrUp(el,a){return up(el,function(n){return n.getAttribute&&n.getAttribute(a)!=null})}
var LS={get:function(k,d){try{var v=localStorage.getItem('kassa_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem('kassa_'+k,JSON.stringify(v))}catch(e){}}};
function fmt(x){x=Math.round(Number(x)||0);var neg=x<0;x=String(Math.abs(x));var o='';
  while(x.length>3){o=' '+x.slice(-3)+o;x=x.slice(0,-3)}return (neg?'−':'')+x+o}
function rub(x){return fmt(x)+' ₽'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/([a-zа-я])(\d)/g,'$1 $2').replace(/(\d)([a-zа-я])/g,'$1 $2').replace(/[^a-zа-я0-9.]+/g,' ').replace(/^\s+|\s+$/g,'')}
function pad(n){return n<10?'0'+n:''+n}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hhmm(iso){var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())}
function uid(){return new Date().getTime().toString(36)+'-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}
function inArr(a,x){for(var i=0;i<a.length;i++)if(a[i]===x)return true;return false}
function findBy(a,f){for(var i=0;i<a.length;i++)if(f(a[i]))return a[i];return null}
function validUrl(u){return /^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec\/?$/.test(u||'')}
var toastTimer;
function toast(m){$('toastT').innerHTML=esc(m);show('toast',true);clearTimeout(toastTimer);toastTimer=setTimeout(function(){show('toast',false)},3000)}

/* запрос к скрипту таблицы (без fetch — его нет на старых кассах) */
function ajax(method,url,body,ok,fail){
  var x=new XMLHttpRequest();
  x.open(method,url,true);
  x.timeout=30000;
  if(body!=null)x.setRequestHeader('Content-Type','text/plain;charset=utf-8');
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var d=null;try{d=JSON.parse(x.responseText)}catch(e){}
    if(x.status>=200&&x.status<300&&d&&d.ok)ok(d);else fail((d&&d.error)||('нет связи с таблицей ('+x.status+')'));
  };
  x.ontimeout=function(){};
  x.send(body==null?null:JSON.stringify(body));
}

/* ---------- данные ---------- */
var DEMO=[['Одноразки','HQD Cuvie Plus 1200',900,480,6],['Одноразки','Elf Bar BC5000',1100,620,4],
  ['Картриджи','Картридж Lost Mary X-Link 20000',1050,480,12],['Жидкости','Husky Double Ice 30 мл',450,210,9],
  ['Жидкости','Rell Green 30 мл',500,240,7],['Испарители','Испаритель Vaporesso GTX 0.6',350,150,20],
  ['Снюс','Corvus Blue',600,330,15],['Аксессуары','Зарядный кабель Type-C',300,90,null]];
DEMO=DEMO.map(function(r,i){return{id:'demo'+i,category:r[0],name:r[1],price:r[2],cost:r[3],stock:r[4]}});

var cfg={url:LS.get('url',''),point:LS.get('point','')};
var points=LS.get('points',POINTS_DEFAULT);
var catAll=null, catalog=[], cart=[], cat='Все', query='', payMethod='cash';
var cDisc={v:0,u:LS.get('cdu','pct')};
function isDemo(){return !validUrl(cfg.url)}

function pickCatalog(){
  if(!isDemo()&&!catAll)catAll=LS.get('catalog_'+cfg.point,null);
  var src=isDemo()?DEMO:(catAll||[]);
  catalog=src.map(function(x){return{id:x.id,name:x.name,price:Number(x.price)||0,cost:Number(x.cost)||0,
    category:x.category||'',stock:x.stock==null?null:Number(x.stock),n:norm(x.name+' '+(x.category||''))}});
}

/* ---------- чеки дня и очередь ---------- */
function checksKey(){return 'checks_'+todayKey()}
var checks=LS.get(checksKey(),[]);
function saveChecks(){LS.set(checksKey(),checks)}
function pendingCount(){var n=0;for(var i=0;i<checks.length;i++)if(checks[i].status==='pending'||checks[i].status==='cancel-pending')n++;return n}

var flushing=false;
function flush(){
  if(isDemo()||flushing)return;
  var c=findBy(checks,function(x){return x.status==='pending'||x.status==='cancel-pending'});
  if(!c){renderSync();return}
  flushing=true;
  var body=c.status==='pending'
    ?{action:'sale',sale:{id:c.id,number:c.number,time:c.time,point:c.point,items:c.items,pay:c.pay}}
    :{action:'cancel',id:c.id};
  ajax('POST',cfg.url,body,function(){
    c.status=c.status==='pending'?'sent':'cancelled';c.err='';saveChecks();flushing=false;renderSync();flush();
  },function(err){c.err=err;saveChecks();flushing=false;renderSync()});
}
setInterval(flush,30000);

/* ---------- каталог из Эвотора ---------- */
function loadCatalog(silent){
  if(isDemo()){pickCatalog();renderAll();return}
  ajax('GET',cfg.url+'?action=catalog&point='+encodeURIComponent(cfg.point),null,function(d){
    if(d.points&&d.points.length){points=d.points;LS.set('points',points)}
    catAll=d.items||[];LS.set('catalog_'+cfg.point,catAll);pickCatalog();renderAll();
    if(!d.found)toast('Точки «'+cfg.point+'» нет среди магазинов Эвотора — выберите точку в настройках');
    else if(!silent)toast('Товары из Эвотора: '+catalog.length);
  },function(){catAll=null;pickCatalog();renderAll();if(!silent)toast('Не удалось загрузить товары — показываю сохранённые')});
}

/* ---------- витрина ---------- */
function renderCats(){
  var cs=['Все'];
  for(var i=0;i<catalog.length;i++)if(catalog[i].category&&!inArr(cs,catalog[i].category))cs.push(catalog[i].category);
  if(!inArr(cs,cat))cat='Все';
  var h='';
  if(cs.length>1)for(var j=0;j<cs.length;j++)h+='<button class="cat'+(cs[j]===cat?' on':'')+'" data-cat="'+esc(cs[j])+'">'+esc(cs[j])+'</button>';
  $('cats').innerHTML=h;
}
function matches(x,toks){
  if(cat!=='Все'&&x.category!==cat)return false;
  for(var i=0;i<toks.length;i++){
    if(x.n.indexOf(toks[i])<0)return false;
  }
  return true;
}
function renderGrid(){
  var toks=norm(query).split(' ').filter(function(t){return t});
  var list=catalog.filter(function(x){return matches(x,toks)});
  var LIMIT=120,more=list.length-LIMIT;list=list.slice(0,LIMIT);
  var inCart={};cart.forEach(function(l){inCart[l.id]=l.qty});
  var h='';
  list.forEach(function(x,i){
    var q=inCart[x.id]||0,left=x.stock==null?null:x.stock-q;
    h+='<button class="tile'+(x.price?'':' noprice')+'" data-idx="'+catalog.indexOf(x)+'">'+
      (q?'<span class="incart">'+q+'</span>':'')+'<span class="nm">'+esc(x.name)+'</span>'+
      '<span class="pr">'+(x.price?rub(x.price):'нет цены')+'</span>'+
      (left==null?'':'<span class="st'+(left<=0?' zero':'')+'">ост. '+left+'</span>')+'</button>';
  });
  if(!list.length)h='<div class="empty">'+(catalog.length?'Ничего не найдено.':'Товаров нет. Откройте «Настройки», выберите точку и нажмите «Обновить товары».')+'</div>';
  else h+='<div class="clear"></div>'+(more>0?'<div class="more">Ещё '+more+' — уточните поиск</div>':'');
  $('grid').innerHTML=h;
}

/* ---------- скидки и чек ---------- */
function discOf(g,v,u){v=Math.max(0,Number(v)||0);if(u==='pct')return Math.min(g,Math.round(g*Math.min(v,100)/100));return Math.min(g,Math.round(v))}
function calc(){
  var rows=cart.map(function(l){var g=l.qty*l.price,d=discOf(g,l.dv,l.du);return{l:l,g:g,d:d,net:g-d}});
  var gross=0,sub=0,i;
  for(i=0;i<rows.length;i++){gross+=rows[i].g;sub+=rows[i].net}
  var D=discOf(sub,cDisc.v,cDisc.u);
  if(D>0){
    var idx=[];for(i=0;i<rows.length;i++)if(rows[i].net>0)idx.push(i);
    var left=D;
    for(var k=0;k<idx.length;k++){var r=rows[idx[k]];
      var sh=k===idx.length-1?left:Math.min(left,Math.round(D*r.net/sub));r.d+=sh;r.net-=sh;left-=sh}
  }
  var net=0;for(i=0;i<rows.length;i++)net+=rows[i].net;
  return{rows:rows,gross:gross,disc:gross-net,net:net};
}
function addItem(idx){
  var it=catalog[idx];if(!it)return;
  var l=findBy(cart,function(x){return x.id===it.id});
  if(l)l.qty++;else{l={id:it.id,name:it.name,price:it.price,cost:it.cost,qty:1,dv:0,du:LS.get('ldu','pct'),open:false};cart.push(l)}
  if(it.stock!=null&&l.qty>it.stock)toast('Остаток «'+it.name+'»: '+it.stock+' — проверьте');
  renderCart();renderGrid();
}
function renderCart(){
  var c=calc(),h='';
  c.rows.forEach(function(r,i){var l=r.l;
    h+='<div class="line"><div class="lrow"><span class="nm">'+esc(l.name)+'</span><span class="sum">'+rub(r.net)+(r.d?'<s>'+rub(r.g)+'</s>':'')+'</span></div>'+
      '<div class="lrow"><button class="qb" data-q="'+i+'" data-d="-1">−</button><span class="qv">'+l.qty+'</span><button class="qb" data-q="'+i+'" data-d="1">+</button>'+
      '<button class="db'+(l.dv?' on':'')+'" data-disc="'+i+'">'+(l.dv?'−'+(l.du==='pct'?l.dv+'%':rub(l.dv)):'Скидка')+'</button>'+
      '<span class="pricef">по <input class="numin" type="number" min="0" data-price="'+i+'" value="'+l.price+'"> ₽</span></div>'+
      (l.open||l.dv?'<div class="lrow"><span class="lab">скидка</span><input class="numin" type="number" min="0" data-dv="'+i+'" value="'+(l.dv||'')+'" placeholder="0">'+
        '<button class="unit" data-du="'+i+'">'+(l.du==='pct'?'%':'₽')+'</button>'+(r.d?'<span class="minus">−'+rub(r.d)+'</span>':'')+'</div>':'')+
      '</div>';
  });
  $('lines').innerHTML=cart.length?h:'<div class="cart-empty">Нажимайте на товары — они появятся в чеке.</div>';
  var n=0,bad=false;cart.forEach(function(l){n+=l.qty;if(!l.price)bad=true});
  $('cdu').innerHTML=cDisc.u==='pct'?'%':'₽';
  if(document.activeElement!==$('cdv'))$('cdv').value=cDisc.v||'';
  var chips=$('cdisc').getElementsByTagName('button');
  for(var i=0;i<chips.length;i++){var p=chips[i].getAttribute('data-p');if(p!=null)chips[i].className='chip'+(cDisc.u==='pct'&&Number(p)===Number(cDisc.v)?' on':'')}
  show('subGross',c.disc>0);show('subDisc',c.disc>0);
  $('gross').innerHTML=rub(c.gross);$('discV').innerHTML='−'+rub(c.disc);
  $('total').innerHTML=rub(c.net);$('barTotal').innerHTML=rub(c.net);
  $('barCount').innerHTML=n?'В чеке '+n+' шт · открыть':'Чек пуст';
  $('payBtn').disabled=$('barPay').disabled=!n||bad;
  $('payBtn').innerHTML=bad?'Укажите цену':'Оплатить';
}

/* ---------- оплата ---------- */
function openCart(on){if(on)$('cart').className='cart open';else $('cart').className='cart';show('backBtn',on)}
function openPay(){
  openCart(false);
  var t=calc().net;
  $('payTotal').innerHTML=rub(t);
  ['given','toWho','mCash','mCard','mTr','mWho'].forEach(function(id){$(id).value=''});
  var q=[t,Math.ceil(t/100)*100,Math.ceil(t/500)*500,Math.ceil(t/1000)*1000,5000],qs=[],h='';
  q.forEach(function(x){if(x>=t&&!inArr(qs,x)&&qs.length<5)qs.push(x)});
  qs.forEach(function(x){h+='<button data-g="'+x+'">'+(x===t?'Без сдачи':rub(x))+'</button>'});
  $('quick').innerHTML=h;
  var who=LS.get('who',[]),o='';who.forEach(function(w){o+='<option value="'+esc(w)+'">'});$('whoList').innerHTML=o;
  setMethod(LS.get('lastMethod','cash'));
  show('payScrim',true);
}
function setMethod(m){
  payMethod=m;
  var bs=$('methods').getElementsByTagName('button');
  for(var i=0;i<bs.length;i++)bs[i].className='method'+(bs[i].getAttribute('data-m')===m?' on':'');
  show('payCash',m==='cash');show('payTransfer',m==='transfer');show('payMixed',m==='mixed');
  updPay();
}
function num(id){return Number($(id).value)||0}
function updPay(){
  var t=calc().net,g=num('given'),ok=true;
  $('changeV').innerHTML=rub(Math.max(0,g-t));
  if(payMethod==='cash'&&g&&g<t)ok=false;
  if(payMethod==='mixed'){
    var rest=t-(num('mCash')+num('mCard')+num('mTr'));
    $('mixNote').innerHTML=rest===0?'Сумма сходится.':(rest>0?'Осталось распределить: '+rub(rest):'Больше суммы чека на '+rub(-rest));
    $('mixNote').className='note'+(rest===0?'':' bad');ok=rest===0;
  }
  $('confirmPay').disabled=!ok;
}
function confirmPay(){
  var cc=calc(),t=cc.net;
  var pay={cash:0,card:0,transfer:0,transferTo:''};
  if(payMethod==='cash')pay.cash=t;
  if(payMethod==='card')pay.card=t;
  if(payMethod==='transfer'){pay.transfer=t;pay.transferTo=$('toWho').value.replace(/^\s+|\s+$/g,'')}
  if(payMethod==='mixed'){pay.cash=num('mCash');pay.card=num('mCard');pay.transfer=num('mTr');pay.transferTo=$('mWho').value.replace(/^\s+|\s+$/g,'')}
  if(pay.transferTo){var w=LS.get('who',[]);if(!inArr(w,pay.transferTo)){w.unshift(pay.transferTo);LS.set('who',w.slice(0,30))}}
  LS.set('lastMethod',payMethod);
  var number=checks.filter(function(c){return c.point===cfg.point}).length+1;
  var c={id:uid(),number:number,time:new Date().toISOString(),point:cfg.point,
    // price — цена со скидкой за 1 шт, basePrice — без скидки; sum/discount — в рублях по строке
    items:cc.rows.map(function(r){return{id:r.l.id,name:r.l.name,qty:r.l.qty,price:Math.round(r.net/r.l.qty*100)/100,
      basePrice:r.l.price,discount:r.d,sum:r.net,cost:r.l.cost}}),
    pay:pay,total:t,disc:cc.disc,status:isDemo()?'demo':'pending'};
  checks.unshift(c);saveChecks();
  cart.forEach(function(l){var it=findBy(catalog,function(x){return x.id===l.id});if(it&&it.stock!=null){it.stock-=l.qty;
    var src=catAll&&findBy(catAll,function(x){return x.id===l.id});if(src)src.stock=it.stock}});
  if(catAll&&!isDemo())LS.set('catalog_'+cfg.point,catAll);
  var given=num('given');
  cart=[];cDisc.v=0;show('payScrim',false);
  renderCart();renderGrid();renderSync();
  toast('Чек №'+number+' — '+rub(t)+(payMethod==='cash'&&given>t?' · сдача '+rub(given-t):''));
  flush();
}

/* ---------- итог дня ---------- */
function payLabel(p){var a=[];if(p.cash)a.push('нал '+rub(p.cash));if(p.card)a.push('безнал '+rub(p.card));
  if(p.transfer)a.push('перевод '+rub(p.transfer)+(p.transferTo?' ('+p.transferTo+')':''));return a.join(' + ')}
function iSum(i){return i.sum!=null?i.sum:i.qty*i.price}
function renderDay(){
  var mine=checks.filter(function(c){return c.point===cfg.point});
  var live=mine.filter(function(c){return c.status!=='cancelled'&&c.status!=='cancel-pending'});
  var s={t:0,cash:0,card:0,tr:0,d:0,p:0},agg={},keys=[];
  live.forEach(function(c){s.t+=c.total;s.cash+=c.pay.cash;s.card+=c.pay.card;s.tr+=c.pay.transfer;s.d+=c.disc||0;
    c.items.forEach(function(i){s.p+=iSum(i)-i.qty*(i.cost||0);
      if(!agg[i.name]){agg[i.name]={name:i.name,qty:0,sum:0};keys.push(i.name)}agg[i.name].qty+=i.qty;agg[i.name].sum+=iSum(i)})});
  $('dayTitle').innerHTML='Итог дня · '+esc(cfg.point);
  var rows=keys.map(function(k){return agg[k]}).sort(function(a,b){return b.sum-a.sum}),q=0,h='';
  rows.forEach(function(r){q+=r.qty;h+='<tr><td>'+esc(r.name)+'</td><td class="n">'+r.qty+' шт</td><td class="n">'+rub(r.sum)+'</td></tr>'});
  $('soldList').innerHTML=rows.length?'<table class="sold">'+h+'<tr><td><b>Итого</b></td><td class="n"><b>'+q+' шт</b></td><td class="n"><b>'+rub(s.t)+'</b></td></tr></table>':'<p class="note">Пока ничего не продано.</p>';
  $('daySum').innerHTML='<div class="w"><span>Выручка за сегодня</span><b>'+rub(s.t)+'</b></div>'+
    '<div><span>Чеков</span><b>'+live.length+'</b></div><div><span>Прибыль</span><b>'+rub(s.p)+'</b></div>'+
    '<div><span>Наличные</span><b>'+rub(s.cash)+'</b></div><div><span>Безнал</span><b>'+rub(s.card)+'</b></div>'+
    '<div><span>Переводы</span><b>'+rub(s.tr)+'</b></div><div><span>Скидки</span><b style="color:#c2571a">'+(s.d?'−'+rub(s.d):'0 ₽')+'</b></div>';
  var pend=pendingCount(),last=findBy(checks,function(c){return c.err&&(c.status==='pending'||c.status==='cancel-pending')});
  $('syncNote').innerHTML=isDemo()?'Демо-режим: чеки хранятся только на этой кассе. Подключите таблицу в настройках.'
    :pend?'Не отправлено в таблицу: '+pend+'. Отправится само, когда появится связь.'+(last?' Причина: '+esc(last.err):''):'Все чеки в таблице.';
  var labels={sent:'<span class="tag ok">в таблице</span>',pending:'<span class="tag warn">в очереди</span>',demo:'<span class="tag warn">демо</span>',
    cancelled:'<span class="tag bad">отменён</span>','cancel-pending':'<span class="tag bad">отменяется</span>'};
  h='';
  mine.forEach(function(c){
    var canCancel=c.status==='sent'||c.status==='pending'||c.status==='demo',off=c.status==='cancelled'||c.status==='cancel-pending';
    h+='<div class="chk'+(off?' cancelled':'')+'"><span class="s">'+rub(c.total)+'</span><span class="t">№'+c.number+' · '+hhmm(c.time)+'</span>'+labels[c.status]+
      '<div class="d">'+esc(c.items.map(function(i){return i.name+(i.qty>1?' ×'+i.qty:'')}).join(', '))+'<br>'+esc(payLabel(c.pay))+(c.disc?' · скидка '+rub(c.disc):'')+
      (canCancel?' <button class="btn small danger" data-cancel="'+c.id+'">Отменить чек</button>':'')+'</div></div>';
  });
  $('dayList').innerHTML=mine.length?h:'<p class="note">Сегодня чеков ещё не было.</p>';
}
function cancelCheck(id,btn){
  if(btn.getAttribute('data-sure')!=='1'){btn.setAttribute('data-sure','1');btn.innerHTML='Точно отменить?';return}
  var c=findBy(checks,function(x){return x.id===id});if(!c)return;
  c.status=c.status==='pending'||c.status==='demo'?'cancelled':'cancel-pending';
  c.items.forEach(function(l){var it=findBy(catalog,function(x){return x.id===l.id});if(it&&it.stock!=null)it.stock+=l.qty});
  saveChecks();renderDay();renderGrid();renderSync();flush();toast('Чек №'+c.number+' отменён');
}

/* ---------- общее ---------- */
function renderSync(){
  var p=pendingCount();
  $('syncDot').className='dot '+(isDemo()?'warn':(p?'bad':'ok'));
  var n=checks.filter(function(c){return c.point===cfg.point&&c.status!=='cancelled'&&c.status!=='cancel-pending'}).length;
  $('dayLabel').innerHTML='Итог дня · чеков '+n+(p?' · не отправлено '+p:'');
  $('pointBtn').innerHTML=esc(cfg.point||'Выберите точку')+(isDemo()?' · демо':'');
  $('pointBtn').className='pill '+(isDemo()?'demo':'point');
  if(!hasCls($('dayScrim'),'hide'))renderDay();
}
function renderAll(){renderCats();renderGrid();renderCart();renderSync()}
function openSettings(){
  var h='';points.forEach(function(p){h+='<option'+(p===cfg.point?' selected':'')+'>'+esc(p)+'</option>'});
  $('pointSel').innerHTML=h;$('urlIn').value=cfg.url||DEFAULT_URL;
  $('setNote').className='note';$('setNote').innerHTML='Товары, цены и остатки берутся из Эвотора — из магазина выбранной точки.';

}

$('barInfo').onclick=function(){openCart(true)};

/* ---------- старт ---------- */
